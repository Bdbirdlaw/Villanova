name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/connect-new-git-AWstI
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          set -euxo pipefail
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d "founders-network" ]; then
            mkdir -p _site/founders-network
            cp -v founders-network/index.html _site/founders-network/index.html
          fi
          # Tell Jekyll not to mangle our file
          touch _site/.nojekyll
          # Log what we're shipping
          ls -laR _site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
